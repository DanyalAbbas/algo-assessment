# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the API as a Docker web service. The database is an external
# PostgreSQL (Neon/Supabase) supplied via DATABASE_URL; Render's own free
# PostgreSQL expires after 30 days, so it is deliberately not used here.
#
# Setup: New -> Blueprint -> point at this repo -> Render will prompt for the
# two `sync: false` values. JWT_SECRET is generated by Render.
services:
  - type: web
    name: algo-assessment-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      # External PostgreSQL pooled connection string.
      - key: DATABASE_URL
        sync: false
      # Render generates a cryptographically random value.
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: LLM_TIMEOUT_MS
        value: "5000"
      - key: LLM_CONCURRENCY
        value: "3"
      # Generous: this API is exercised by automated concurrency suites from
      # a single IP, and a tight cap would reject legitimate load as 429.
      - key: THROTTLE_TTL_MS
        value: "60000"
      - key: THROTTLE_LIMIT
        value: "2000"
      - key: AUTH_LOGIN_RATE_LIMIT
        value: "60"
      - key: AUTH_REFRESH_RATE_LIMIT
        value: "120"